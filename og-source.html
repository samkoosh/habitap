<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Nunito;font-weight:700;src:url(../node_modules/@fontsource/nunito/files/nunito-latin-700-normal.woff2)}
@font-face{font-family:Nunito;font-weight:800;src:url(../node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2)}
@font-face{font-family:Nunito;font-weight:900;src:url(../node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2)}
@font-face{font-family:Caveat;font-weight:700;src:url(../node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2)}
:root{--ground:#eef3ea;--ink:#1d2e28;--soft:#4c5f56;--moss:#557046;--ochre:#c08a2b;--ochre-ink:#8a5f14}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 78% 50%,#f8faf5 0,var(--ground) 55%,#e3ebdd 100%);font-family:Nunito,sans-serif;color:var(--ink)}
#globe{position:absolute;left:560px;top:-40px}
.copy{position:absolute;left:76px;top:170px;width:470px}
.copy h1{margin:0;font-weight:900;font-size:96px;line-height:.98;letter-spacing:-.02em}
.copy h1 b{color:var(--moss);font-weight:900}
.copy p{margin:22px 0 0;font-weight:700;font-size:29px;line-height:1.3;color:var(--soft)}
.pill{display:inline-flex;align-items:center;gap:12px;margin-top:34px;background:var(--moss);color:#fff;font-weight:800;font-size:25px;border-radius:999px;padding:14px 28px 14px 30px;box-shadow:0 10px 24px -12px rgba(29,46,40,.6)}
.pill svg{width:22px;height:22px}
.mark{position:absolute;left:76px;top:68px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;color:var(--soft);letter-spacing:.02em}
.mark i{width:34px;height:34px;border-radius:9px;background:var(--moss);display:grid;place-items:center}
.polaroid{position:absolute;left:600px;top:92px;width:318px;padding:18px 18px 0;background:#fffdf8;border-radius:4px;transform:rotate(-6deg);box-shadow:0 2px 3px rgba(0,0,0,.12),0 26px 50px -18px rgba(29,46,40,.55)}
.polaroid .ph{width:282px;height:282px;border-radius:2px;overflow:hidden;display:block}
.polaroid .cap{font-family:Caveat,cursive;font-weight:700;font-size:44px;color:#2b3a33;text-align:center;padding:12px 0 18px;transform:rotate(-1deg)}
.tape{position:absolute;left:118px;top:-16px;width:92px;height:30px;background:rgba(236,229,200,.85);transform:rotate(3deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
</style></head><body>
<canvas id="globe" width="1320" height="1320" style="width:660px;height:660px"></canvas>
<div class="copy">
  <h1>Play<br>Habi<b>tap</b></h1>
  <p>Guess where rare animals and plants live. New ones every day.</p>

    <radialGradient id="lt" cx=".3" cy=".1" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7b9c6"/><stop offset="1" stop-color="#e88ea3"/></linearGradient>
  </defs>
  <rect width="282" height="282" fill="url(#w)"/>
  <rect width="282" height="282" fill="url(#lt)"/>
  <g fill="#3d7a5a" opacity=".75"><path d="M18 282c4-50 14-90 30-120-6 40-8 80-6 120z"/><path d="M40 282c2-36 10-64 22-86-2 30-2 58 0 86z"/><path d="M250 282c-2-60 4-100 18-130-2 40 0 90 2 130z"/><path d="M230 282c0-30 6-52 14-70 0 24 0 46-2 70z"/></g>
  <g fill="#cfe3dc" opacity=".55"><circle cx="196" cy="52" r="5"/><circle cx="208" cy="34" r="3.5"/><circle cx="200" cy="18" r="2.5"/></g>

  <path d="M196 196c30 2 56-10 72-28-6 26-30 44-64 48z" fill="#f2a6b8" stroke="#d97b93" stroke-width="2"/>

<div class="cap">Where do I live?</div></div>
<script src="d3.min.js"></script>
<script src="../node_modules/topojson-client/dist/topojson-client.min.js"></script>
<script>
fetch('../node_modules/world-atlas/land-110m.json').then(r=>r.json()).catch(()=>null).then(go);
function go(topo){
  const c=document.getElementById('globe'),ctx=c.getContext('2d');ctx.scale(2,2);
  const R=320,cx=330,cy=330,proj=d3.geoOrthographic().translate([cx,cy]).scale(R).rotate([-30,-12]).clipAngle(90),path=d3.geoPath(proj,ctx);
  const g=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);g.addColorStop(0,'#86adb6');g.addColorStop(1,'#4a717c');
  ctx.beginPath();path({type:'Sphere'});ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();path(d3.geoGraticule10());ctx.strokeStyle='rgba(243,244,236,.16)';ctx.lineWidth=.8;ctx.stroke();
  if(topo){const land=topojson.feature(topo,topo.objects.land);ctx.beginPath();path(land);ctx.fillStyle='#ece5c8';ctx.fill();ctx.strokeStyle='#7d704c';ctx.lineWidth=.8;ctx.stroke()}
  // the hint circle and a pin, as in the game
  ctx.beginPath();path(d3.geoCircle().center([47,-19]).radius(10.8)());ctx.fillStyle='rgba(192,138,43,.2)';ctx.fill();ctx.setLineDash([7,5]);ctx.strokeStyle='rgba(192,138,43,.95)';ctx.lineWidth=2.5;ctx.stroke();ctx.setLineDash([]);
  const sh=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.2,cx,cy,R*1.02);sh.addColorStop(0,'rgba(255,253,240,.18)');sh.addColorStop(.65,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(20,35,30,.32)');
  ctx.beginPath();path({type:'Sphere'});ctx.fillStyle=sh;ctx.fill();ctx.strokeStyle='rgba(29,46,40,.35)';ctx.lineWidth=1;ctx.stroke();
  const [px,py]=proj([50,-16]);ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(px,py+3,9,3.5,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(px,py);ctx.bezierCurveTo(px-15,py-17,px-13,py-36,px,py-36);ctx.bezierCurveTo(px+13,py-36,px+15,py-17,px,py);ctx.fillStyle='#c08a2b';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(px,py-24,5,0,7);ctx.fillStyle='#fff';ctx.fill();
  document.body.dataset.ready=1}
</script></body></html>
